# Example configuration file for Laguna experiments.
# Copy and adapt for your setup. Omit a section entirely to disable that subsystem.

timing:
  checkpoint_file: ./experiment_checkpoint.json
  event_log: ./experiment_events.csv

# gauge:
#   port: /dev/ttyUSB2          # Massa M-5000 ultrasonic sensor
#   sensor_ids: [0]
#   offset_mm: 0.0
#   interval_s: 5               # read every 5 s

# weir:
#   port: /dev/ttyUSB1          # Teknic ClearCore motor controller
#   baudrate: 9600
#   home_offset_mm: 0.0
#   # Scheduling (choose one):
#   interval_s: 20              # poll status every 20 s (read-only, no motor motion)
#   # use_schedule: true        # follow schedule CSV (calls go_to_elevation); requires --schedule

# Flow controller (Fuji VFD pump + solenoid valves). Omit section to disable.
# flow:
#   vfd_port: /dev/ttyUSB3
#   vfd_slave_id: 1
#   motor_port: /dev/ttyUSB1  # shared serial port with weir
#   motor_baudrate: 9600
#   C0: 4.902                 # flowrate-to-frequency calibration: Hz = C2*Q^2 + C1*Q + C0
#   C1: 58.49
#   C2: 0.08956
#   # Scheduling (choose one):
#   # interval_s: 20          # poll status every 20 s (read-only)
#   # use_schedule: true      # follow schedule CSV (pump_flow_lpm, qin_open, qaux_open columns)

# pi_cameras:
#   hosts:
#     - pi1.local               # SSH hostnames or IPs of Pi camera nodes
#     - pi2.local
#   ssh_user: ucrs
#   ssh_key: ~/.ssh/id_ed25519
#   lead_time: 5.0
#   output_dir: ./captures/pi
#   # Scheduling (choose one):
#   interval_s: 30              # capture every 30 s
#   # trigger_at: [60, 120, 180]   # capture at these specific runtime seconds
#   # use_schedule: true            # fire at schedule CSV time_s rows;
#   #                               # add a pi_cameras column (1/0) to filter which rows trigger

gantry:                       # Modusystems OEM-2T gantry (Snap2Motion ASCII protocol). Omit to disable.
  transport: pi_agent         # pi_agent (default) | ethernet | rs232 | socket_bridge (retired)
                              # pi_agent launches gantry_agent.py over SSH itself, owns the
                              # serial port outright, and is the only transport that supports
                              # topographic scanning. socket_bridge is retired — it depended on
                              # serial_bridge.py, a hand-started Pi-side script; see
                              # docs/MACRON_GANTRY.md "Retired: serial_bridge.py".
  host: red.lab       # Pi hostname, next to the controller
  ssh_user: oak               # for the pi_agent transport
  ssh_key: ~/.ssh/id_ed25519
  remote_serial_device: /dev/serial/by-id/usb-FTDI_USB-RS232_Cable_AV0K9L0C-if00-port0
  remote_baud: 9600
  group_index: 1
  safe_mode: true              # client-side query-only allowlist enforced — do not disable
                                # without explicit authorization to command motion
  axes:                        # 8 axis slots are physically present, split across two PLC nodes:
                                # commander (1-4: X, Y, encoder, encoder) and responder (5-8: Z,
                                # Theta, encoder, encoder). Slots 3/4/7/8 are encoder-only, not
                                # exposed/commandable motion axes.
    - {name: X, index: 1}
    - {name: Y, index: 2, brake_output: 4, brake_status_input: 8}   # SOB 4 / INB 8 confirmed (commander)
    - {name: Z, index: 5, brake_output: 5}                          # SOB 5 confirmed (commander);
                                                                     # brake_status_input lives on the
                                                                     # responder's own input bank and has
                                                                     # no ASCII addressing path — see
                                                                     # IOMap docstring in commands.py
    - {name: Theta, index: 6}   # limit switch lives on the responder — same caveat as Z's brake status
  homing:                      # deprioritized — not currently used, but the driver supports it
    speed_mm_s: 10.0
    standoff_mm: 5.0
    order: [Z, X, Y]
  fences:                   # populate once the work envelope / exclusion zones are known
    - {type: box, name: hvac, x: [650, 1400], y: [115, 900], z: [360, 1000]}
  # TEMPORARY: 1 raw controller (ACP) unit = this many real mm on X/Y/Z —
  # confirmed 15.0 on hardware 2026-07-28, see docs/GANTRY_UNIT_CALIBRATION.md.
  # The single toggle: change to 1.0 (and gantry_agent.py's matching
  # MM_PER_ACP_UNIT constant) once the DSM project's axis scale is fixed at
  # the source — nothing else needs to change.
  mm_per_acp_unit: 15.0
  # Real-mm translation from the gantry's raw zero to a real-world origin.
  coordinate_offset: {X: 0.0, Y: 0.0, Z: 0.0, Theta: 0.0}
  position_checkpoint_file: ./tmp/positions.tmp

# OD2000 / WTT12L PowerProx rangefinders, via an ifm AL1342 IO-Link master.
# Add one block per sensor in use — od2000 and wtt12l use the same shape,
# paired with laguna.rangefinder.OD2000Rangefinder / WTT12LRangefinder.
od2000:
  topic: laguna/od2000        # MQTT topic for continuous/background monitoring
  pdin_port: 2                # IO-Link port — confirmed on hardware 2026-07-28
  offset_mm: 0.0               # physical mounting offset
  al1342_host: 192.168.1.251  # required for activate()/deactivate()/read_mm() — raw IP, no DNS
  calibration_file: sandbox/od2000-cal-2026-08-02.csv      # path to a scripts/calibrate_rangefinder.py CSV, if fitted
  output_dir: data/scans/
wtt12l:
  topic: laguna/wtt12l
  pdin_port: 7                # DP4200 analog bridge port — confirmed on hardware 2026-07-28
  offset_mm: 0.0
  al1342_host: 192.168.1.251
  calibration_file: sandbox/powerprox-cal-2026-07-28.csv      # fitted against current_ma, not distance_mm — see that script
  output_dir: data/scans/

# LMI Gocator 2690 line-laser 3D scanner. Unlike the rangefinders above it is a
# plain Ethernet device on the laguna PC's own network — no Pi, no IO-Link, no
# MQTT. Encoderless: the gantry supplies constant-velocity motion and we
# bracket the pass with a software trigger. See docs/subsystems/scanner.md.
gocator:
  ip: 192.168.1.10            # raw IP; the sensor's web UI is on port 80
  mounting:                   # sensor axes -> gantry axes. Went through two wrong
                               # guesses before landing here (2026-08-11): a physical
                               # "eyeball" check on the mount got the sign backward,
                               # and a follow-up "does the oriented X coordinate track
                               # the gantry's travel direction" numeric argument also
                               # pointed the wrong way and produced a mirrored scan.
                               # These values are the ones confirmed by actually
                               # looking at an oriented real scan
                               # (data/scans/scan_20260811_235747_958.npz) and judging
                               # by eye whether the geometry is a mirror image — that
                               # visual check is the one that's actually authoritative
                               # here, not a proxy metric. scan_y's sign is forced by
                               # scan_x/scan_z per laguna.scanner.mounting's
                               # determinant check regardless (the other sign mirrors
                               # the data — rejected outright). See that module's
                               # docstring before touching this.
    scan_x: -Y
    scan_y: +X
    scan_z: +Z
  travel_speed_mm_s: 100     # MUST match the gantry feed rate used to scan —
                               # this is what scales the Y (travel) axis, since
                               # there is no encoder. Writes to sensor flash,
                               # so laguna only pushes it when it changes.
  frame_rate_hz: 75
                               # profile trigger rate. Omitting this does NOT
                               # adopt the sensor's max — it leaves whatever
                               # mode/rate is already in sensor flash
                               # unchanged (see GocatorScanner's docstring).
                               # Set frame_rate_max: true instead to force max.
                               # Y spacing = travel_speed / frame_rate
                               # (20 mm/s at 200 Hz = 0.1 mm between profiles).
                               # NOT the datasheet's 10 kHz headline: the real
                               # ceiling is FOV/exposure-dependent AND dynamic.
                               # Measured on this unit 2026-07-30: 443.127 Hz
                               # with max-frame-rate mode on, but 221.563 Hz
                               # once an explicit rate is set. Stay under ~220,
                               # or omit to let the sensor pick. laguna
                               # re-validates after flushing and raises if the
                               # sensor can't deliver the requested rate —
                               # see docs/subsystems/scanner.md.
  active_area:
    x: -722.0        # origin, across-laser
    # y: 0.0        # origin, along travel
    z: -130.0        # origin, range/standoff
    width: 1422.0 # extent in X (across laser)
    # length: 200.0 # extent in Y (along travel)
    height: 200.0 # extent in Z (range/standoff) — cutting this helps frame rate most
  # fixed_length_mm: 200.0      # surface length along travel; cover the scan distance
  exposure_us: 200           # laser exposure; omit to leave the sensor's setting
  uniform_spacing: null       # true/false to force X resampling on/off; omit to
                               # leave as-is. Disabling it raises the max scan rate.
  output_dir: ./data/scans
  sdk_lib_dir: null           # dir holding libGoSdk.so/libkApi.so. Omit to use
                               # $LAGUNA_GOSDK_LIB_DIR or a conventional path —
                               # build them first with scripts/build_gosdk.sh
  scan:
    formats: [npz, laz]   # or whatever you want persisted

frames:
  experiment:
    translation: [-467,-281,0]
  instruments:
    gocator:
      # No axes: here on purpose, even though the sensor IS physically
      # rotated — that rotation lives solely in gocator.mounting above.
      # orient_scan() refuses to run if both this block and the scan's own
      # mounting carry a rotation (would double-rotate the data); SurveyRunner's
      # edge-align path (survey.py) pre-rotates via the scanner's own
      # .mounting instead of relying on this transform, for the same reason.
      translation: [-382,-83,0]
      # translation: [-467,-280,0] # measured to OD2000 point
    wtt12l:
      translation: [0,0,0]
    od2000:
      translation: [85,200,0]



