# Example configuration file for Laguna experiments
# Copy this to your_experiment.yaml and modify for your specific setup

robot:
  port: "/dev/ttyUSB0"          # Serial port for robot controller
  baudrate: 9600
  protocol: "modbus"            # or "ascii"
  timeout: 5.0

camera:
  device_id: 0                  # Camera device number
  fps: 30                       # Frames per second
  resolution: [1920, 1080]      # Width, Height
  capture_format: "BGR"         # BGR, RGB, or GRAY

weir:
  port: "/dev/ttyUSB0"          # Serial port for Teknic ClearCore motor
  baudrate: 9600
  steps_per_mm: 1000.0          # Motor steps per mm of weir travel
  home_offset_mm: 0.0           # Elevation at the home position (mm)

gauge:
  port: "/dev/ttyUSB2"          # Serial port for Massa ultrasonic sensor
  sensor_ids: [0]               # List of sensor IDs to poll
  offset_mm: 0.0                # Sensor mounting offset (mm)

flow:
  vfd_port: "/dev/ttyUSB1"      # Serial port for Fuji VFD
  vfd_slave_id: 1               # Modbus slave ID
  motor_port: "/dev/ttyUSB0"    # Shared with weir controller
  motor_baudrate: 9600
  C0: 4.902                     # Flowrate-to-frequency calibration coefficients
  C1: 58.49                     # freq = C2*Q^2 + C1*Q + C0  (Hz, L/min)
  C2: 0.08956

data:
  output_directory: "./data/"
  compression: "gzip"           # or "none"

storage:
  enabled: false
  type: "local"                 # local, s3, or sftp
  # For S3:
  # bucket: "my-bucket"
  # region: "us-east-1"
  # credentials: "~/.aws/credentials"
  
  # For SFTP:
  # host: "remote.server.edu"
  # port: 22
  # username: "labuser"
  # key_file: "~/.ssh/id_rsa"
  # remote_path: "/data/experiments"
