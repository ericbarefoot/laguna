# Example configuration file for Laguna experiments
# Copy this to your_experiment.yaml and modify for your specific setup

robot:
  port: "/dev/ttyUSB0"          # Serial port for robot controller
  baudrate: 9600
  protocol: "modbus"            # or "ascii"
  timeout: 5.0

# Camera list — supports local (USB/CSI) and network (Pi) cameras.
# 'cameras' takes precedence over the legacy 'camera' key below.
cameras:
  - name: pi_array
    type: network
    hosts:
      - antares.laguna
      - sirius.laguna
    ssh_user: ucrs
    ssh_key: /home/eric/.ssh/id_ed25519
    # ssh_passphrase is read from ~/.config/laguna/ssh_passphrase at runtime
    lead_time: 5.0
    output_dir: ./captures

  # Uncomment to add a local USB camera alongside the Pi array:
  # - name: side_view
  #   type: local
  #   device_id: 0
  #   fps: 30
  #   resolution: [1920, 1080]

# Legacy single-camera config — still accepted if 'cameras' list is empty.
camera:
  device_id: 0
  fps: 30
  resolution: [1920, 1080]
  capture_format: "BGR"

hydraulics:
  port: "/dev/ttyUSB1"
  baudrate: 9600
  poll_interval: 0.1            # Seconds between status polls

data:
  output_directory: "./data/"
  compression: "gzip"           # or "none"

storage:
  enabled: false
  type: "local"                 # local, s3, or sftp
  # For S3:
  # bucket: "my-bucket"
  # region: "us-east-1"
  # credentials: "~/.aws/credentials"

  # For SFTP:
  # host: "remote.server.edu"
  # port: 22
  # username: "labuser"
  # key_file: "~/.ssh/id_rsa"
  # remote_path: "/data/experiments"

timing:
  checkpoint_file: "./experiment_checkpoint.json"
  event_log: "./experiment_events.csv"
