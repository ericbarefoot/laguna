[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laguna"
version = "0.1.0"
description = "Control software for robotic systems in hydraulic flume experiments"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Lab Team"}
]
keywords = ["robotics", "hydraulics", "data-acquisition", "flume"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "pyserial>=3.5",          # For ASCII serial communication
    "pymodbus>=3.0",          # For Modbus protocol
    "numpy>=1.21",            # For numerical operations
    "opencv-python>=4.5",     # For camera operations
    "pyyaml>=6.0",            # For YAML configuration files
    "scipy>=1.7",             # For schedule interpolation
    "pandas>=1.3",            # For schedule data loading
    "openpyxl>=3.0",          # For Excel schedule files
    "paramiko>=2.12",         # SSH/SFTP — camera.network and robot.macron.pi_bridge both
                               # import this unconditionally, so it's a core dependency
    "paho-mqtt>=1.6",          # MQTT client — rangefinder/OD2000 data path via AL1342
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.950",
    "ruff>=0.4",
]
scanner = [
    # LAS/LAZ point-cloud export for Gocator scans (SurfaceScan.save_las).
    # Optional because only the scanner subsystem uses it; lazrs supplies the
    # LAZ compression backend, which is what makes LAZ ~100x faster and ~85x
    # smaller than CSV on a full-resolution scan.
    "laspy[lazrs]>=2.5",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]
storage = [
    "boto3>=1.20",            # AWS S3 (paramiko for SFTP is now a core dependency)
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/laguna --cov-report=html"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# "D" is pydocstyle — docstring presence/format checks, configured for the
# Google convention this codebase already follows (Args/Returns/Raises).
select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
